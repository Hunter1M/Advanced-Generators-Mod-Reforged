plugins {
    id 'java'
    id 'scala'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

file "build.properties" withReader {
    def prop = new Properties()
    prop.load(it)
    ext.config = new ConfigSlurper().parse prop
}

if (project.hasProperty('buildnum')) {
    ext.simpleVersion = "${config.mod.version}.${project.buildnum}"
} else {
    ext.simpleVersion = "${config.mod.version}-DEV"
}

version = simpleVersion + '-mc' + config.minecraft.version

group = 'net.bdew'
base {
    archivesName = config.mod.id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = config.neoforge.version

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.logging.console.level', 'debug'
        }

        server {
            server()
            gameDirectory = project.file('run')
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.logging.console.level', 'debug'
        }

        data {
            data()
            gameDirectory = project.file('run')
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.logging.console.level', 'debug'
            programArguments.addAll '--mod', config.mod.id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        advgenerators {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.psd'
    exclude '**/.cache/**'
}

repositories {
    mavenCentral()

    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        name = "CreateMod"
        url = "https://maven.createmod.net/"
        content {
            includeGroup "net.createmod.ponder"
            includeGroup "dev.engine-room.flywheel"
            includeGroup "com.tterrag.registrate"
        }
    }
}

dependencies {
    // Scala runtime. It is embedded into the mod jar with Jar-in-Jar and also put on the
    // classpath of the development runs (external jars are not loaded as mods before 1.21.9).
    jarJar(implementation("org.scala-lang:scala-library:${config.scala.version}")) {
        version {
            strictly '[2.13,2.14)'
            prefer config.scala.version
        }
    }
    additionalRuntimeClasspath "org.scala-lang:scala-library:${config.scala.version}"

    // IC2: Nostalgia API (optional at runtime)
    compileOnly "curse.maven:industrial-craft-2-nostalgia-1725644:9316825"

    // Optional energy integration APIs
    compileOnly "maven.modrinth:mekanism:10.7.19.85"
    compileOnly "maven.modrinth:buildcraft-community-edition:8.0.25+1.21.1+neoforge"
    compileOnly "maven.modrinth:create:6.0.10+mc1.21.1"
    compileOnly "net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6"
    compileOnly "maven.modrinth:electrodynamics:1.21.1-1.1.1"
    compileOnly "maven.modrinth:voltaic:1.21.1-1.2.2"
}

tasks.withType(ScalaCompile).configureEach {
    options.release = 21
    scalaCompileOptions.additionalParameters = [
            '-deprecation',
            '-feature',
            '-language:implicitConversions',
            '-language:existentials',
            '-language:higherKinds'
    ]
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : config.mod.id,
                "Specification-Vendor"    : "bdew",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : simpleVersion,
                "Implementation-Vendor"   : "bdew",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifact jar
        }
    }
}
